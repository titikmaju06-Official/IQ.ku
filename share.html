<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <style>
        #shareHome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 24px; text-align: center; }
        #shareHome h1 { font-size: 1.6rem; margin-bottom: 6px; }
        #shareHome p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }
        #shareHome .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 320px; }
        #shareHome .menu-item { background: var(--card-bg2); border-radius: 16px; padding: 24px 12px; text-align: center; cursor: pointer; border: 1px solid var(--border-color3); transition: all 0.3s ease; }
        #shareHome .menu-item:hover { background: var(--card-bg-hover); transform: translateY(-2px); }
        #shareHome .menu-item .icon { font-size: 2rem; margin-bottom: 8px; }
        #shareHome .menu-item .label { font-size: 0.85rem; font-weight: 600; }
        .share-credit { position: fixed; bottom: 12px; font-size: 0.7rem; color: var(--text-dim); text-align: center; width: 100%; }
        #shareTest { display: none; }
        #shareResult { display: none; }
        .share-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-color3); }
        .share-header .back { background: none; border: none; color: var(--text-muted4); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
        .share-header .back:hover { color: var(--text-color); }
        .share-header .title { font-weight: 600; font-size: 0.9rem; }
        .share-header .timer { margin-left: auto; font-size: 0.82rem; color: var(--text-muted); }
        #shareTestContent { padding: 16px; overflow-y: auto; flex: 1; }
        #shareProgress { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 0.78rem; color: var(--text-muted2); border-top: 1px solid var(--border-color3); margin-top: auto; }
        #shareProgress .bar { flex: 1; height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 12px; align-self: center; }
        #shareProgress .bar .fill { height: 100%; background: linear-gradient(90deg,#667eea,#764ba2); border-radius: 2px; transition: width 0.3s; }
        #shareResultContent { padding: 16px; overflow-y: auto; flex: 1; }
        .share-container { display: flex; flex-direction: column; height: 100%; }
    </style>
</head>

        </div>

                <span class="title">Hasil Tes</span>

        function shareApplyTheme() {
            const theme = localStorage.getItem('iqku_theme');
            const btn = document.getElementById('shareThemeToggle');
            if (theme === 'light') {
                document.documentElement.classList.add('light-theme');
                if (btn) btn.textContent = '☀️';
            } else {
                document.documentElement.classList.remove('light-theme');
                if (btn) btn.textContent = '🌙';
            }
        }

        function shareToggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-theme');
            localStorage.setItem('iqku_theme', isLight ? 'light' : 'dark');
            document.getElementById('shareThemeToggle').textContent = isLight ? '☀️' : '🌙';
        }

        shareApplyTheme();

        let shareCurrentQuestion = 0;

        let shareTimerInterval = null;

                shareTimeLeft = MAX_TIME.iq;
            } else if (type === 'disc') {
                shareAnswers = DISC_QUESTIONS.map(() => ({ most: null, least: null }));
                shareTimeLeft = MAX_TIME.disc;
            } else if (type === 'mbti') {
                shareAnswers = new Array(MBTI_QUESTIONS.length).fill(null);
                shareTimeLeft = MAX_TIME.mbti;
            } else {
                shareAnswers = new Array(RAISEC_QUESTIONS.length).fill(null);
                shareTimeLeft = MAX_TIME.raisec;
            }
            const titles = { iq: 'Tes IQ', disc: 'Tes DISC', mbti: 'Tes MBTI', raisec: 'Tes RAISEC' };
            document.getElementById('shareTestTitle').textContent = titles[type];
            showShare('shareTest');
            shareRenderQuestion();
            shareStartTimer();
        }

        function shareStartTimer() {
            if (shareTimerInterval) clearInterval(shareTimerInterval);
            shareTimerInterval = setInterval(() => {
                shareTimeLeft--;
                if (shareTimeLeft <= 0) { shareTimeLeft = 0; shareSubmit(); }
                const m = Math.floor(shareTimeLeft / 60);
                const s = shareTimeLeft % 60;
                const t = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                document.getElementById('shareTimerDisplay').textContent = t;
                document.getElementById('shareTimer').textContent = t;
            }, 1000);
        }

        function shareStopTimer() {
            if (shareTimerInterval) { clearInterval(shareTimerInterval); shareTimerInterval = null; }
        }

        function shareRenderQuestion() {
            const content = document.getElementById('shareTestContent');
            const q = shareCurrentTest === 'disc' ? DISC_QUESTIONS[shareCurrentQuestion] : null;
            const total = shareCurrentTest === 'iq' ? IQ_QUESTIONS.length : shareCurrentTest === 'disc' ? DISC_QUESTIONS.length : shareCurrentTest === 'mbti' ? MBTI_QUESTIONS.length : RAISEC_QUESTIONS.length;

            document.getElementById('shareProgressText').textContent = (shareCurrentQuestion + 1) + '/' + total;
            document.getElementById('shareProgressFill').style.width = ((shareCurrentQuestion + 1) / total * 100) + '%';

            if (shareCurrentTest === 'iq') shareRenderIQ();
            else if (shareCurrentTest === 'disc') shareRenderDISC();
            else if (shareCurrentTest === 'mbti') shareRenderMBTI();
            else shareRenderRAISEC();
        }

        function shareRenderIQ() {
            const q = IQ_QUESTIONS[shareCurrentQuestion];
            const content = document.getElementById('shareTestContent');
            content.innerHTML = '<div class="question-text">' + q.question + '</div><div class="options-list">' +
                q.options.map((o, i) => '<div class="option-item' + (shareAnswers[shareCurrentQuestion] === i ? ' selected' : '') + '" onclick="shareSelectIQ(' + i + ')">' +
                '<div class="option-radio"></div><span>' + o + '</span></div>').join('') + '</div>';
        }

        function shareSelectIQ(idx) {
            shareAnswers[shareCurrentQuestion] = idx;
            setTimeout(() => {
                if (shareCurrentQuestion < IQ_QUESTIONS.length - 1) { shareCurrentQuestion++; shareRenderQuestion(); }
                else shareSubmit();
            }, 300);
        }

        function shareRenderDISC() {
            const q = DISC_QUESTIONS[shareCurrentQuestion];
            const ans = shareAnswers[shareCurrentQuestion];
            const content = document.getElementById('shareTestContent');
            let html = '<div style="margin-bottom:16px;"><div style="font-size:0.78rem;color:var(--text-muted2);margin-bottom:4px;">Paling Sesuai</div><div class="options-list">';
            q.options.forEach((o, i) => {
                html += '<div class="option-item' + (ans.most === o.label ? ' selected' : '') + '" onclick="shareSelectDISC(' + i + ', \'most\')"><div class="option-radio"></div><span>' + o.text + '</span></div>';
            });
            html += '</div></div><div><div style="font-size:0.78rem;color:var(--text-muted2);margin-bottom:4px;">Paling Tidak Sesuai</div><div class="options-list">';
            q.options.forEach((o, i) => {
                html += '<div class="option-item' + (ans.least === o.label ? ' selected' : '') + '" onclick="shareSelectDISC(' + i + ', \'least\')"><div class="option-radio"></div><span>' + o.text + '</span></div>';
            });
            html += '</div></div>';
            html += '<div class="question-text" style="margin-top:16px;font-size:0.85rem;">' + q.situation + '</div>';
            content.innerHTML = html;
        }

        function shareSelectDISC(idx, type) {
            const label = DISC_QUESTIONS[shareCurrentQuestion].options[idx].label;
            shareAnswers[shareCurrentQuestion][type] = label;
            // Auto-advance if both selected
            if (shareAnswers[shareCurrentQuestion].most && shareAnswers[shareCurrentQuestion].least) {
                setTimeout(() => {
                    if (shareCurrentQuestion < DISC_QUESTIONS.length - 1) { shareCurrentQuestion++; shareRenderQuestion(); }
                    else shareSubmit();
                }, 300);
            } else {
                shareRenderQuestion();
            }
        }

        function shareRenderMBTI() {
            const q = MBTI_QUESTIONS[shareCurrentQuestion];
            const content = document.getElementById('shareTestContent');
            content.innerHTML = '<div class="question-text">' + q.question + '</div><div class="options-list">' +
                q.options.map((o, i) => '<div class="option-item' + (shareAnswers[shareCurrentQuestion] === i ? ' selected' : '') + '" onclick="shareSelectMBTI(' + i + ')">' +
                '<div class="option-radio"></div><span>' + o.text + '</span></div>').join('') + '</div>';
        }

        function shareSelectMBTI(idx) {
            shareAnswers[shareCurrentQuestion] = idx;
            setTimeout(() => {
                if (shareCurrentQuestion < MBTI_QUESTIONS.length - 1) { shareCurrentQuestion++; shareRenderQuestion(); }
                else shareSubmit();
            }, 300);
        }

        function shareRenderRAISEC() {
            const q = RAISEC_QUESTIONS[shareCurrentQuestion];
            const content = document.getElementById('shareTestContent');
            const ans = shareAnswers[shareCurrentQuestion];
            content.innerHTML = '<div class="question-text">' + q.text + '</div>' +
                '<div class="options-list" style="flex-direction:row;gap:14px;justify-content:center;margin-top:24px;">' +
                '<div class="option-item raisec-yes' + (ans === true ? ' selected' : '') + '" onclick="shareSelectRAISEC(true)" style="flex:1;text-align:center;padding:16px 10px;border-radius:14px;font-weight:600;">Ya</div>' +
                '<div class="option-item raisec-no' + (ans === false ? ' selected' : '') + '" onclick="shareSelectRAISEC(false)" style="flex:1;text-align:center;padding:16px 10px;border-radius:14px;font-weight:600;">Tidak</div>' +
                '</div>';
        }

        function shareSelectRAISEC(val) {
            shareAnswers[shareCurrentQuestion] = val;
            setTimeout(() => {
                if (shareCurrentQuestion < RAISEC_QUESTIONS.length - 1) { shareCurrentQuestion++; shareRenderQuestion(); }
                else shareSubmit();
            }, 300);
        }

        function shareSubmit() {
            shareStopTimer();
            if (shareCurrentTest === 'iq') shareShowIQResult();
            else if (shareCurrentTest === 'disc') shareShowDISCResult();
            else if (shareCurrentTest === 'mbti') shareShowMBTIResult();
            else shareShowRAISECResult();
        }

        function shareConfirmBack() {
            if (confirm('Yakin ingin kembali? Jawaban akan hilang.')) {
                shareStopTimer();
                showShare('shareHome');
            }
        }

        function shareGoHome() {
            shareStopTimer();
            showShare('shareHome');
        }

        function shareShowIQResult() {
            const total = IQ_QUESTIONS.length;
            const correct = shareAnswers.reduce((sum, ans, idx) => sum + (ans === IQ_QUESTIONS[idx].answer ? 1 : 0), 0);
            const category = IQ_RESULTS.find(r => correct >= r.min && correct <= r.max);
            const iqScore = Math.round(70 + (correct / total) * 80);
            showShare('shareResult');
            document.getElementById('shareResultContent').innerHTML = `
                <div style="text-align:center;padding:30px 0;">
                    <div style="font-size:3rem;font-weight:800;">${iqScore}</div>
                    <div style="color:#667eea;font-weight:600;">${category.label}</div>
                    <div style="font-size:0.82rem;color:var(--text-muted2);margin-top:6px;">Benar ${correct} dari ${total} soal</div>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Analisis Hasil</h3>
                    <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);">${category.desc}</p>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Rekomendasi Pengembangan</h3>
                    <ul>${category.recommendations.map(r => '<li>' + r + '</li>').join('')}</ul>
                </div>
                <div style="text-align:center;padding:16px 0;">
                    <button class="btn btn-primary" onclick="shareGoHome()" style="width:100%;">Kembali</button>
                </div>
            `;
        }

        function shareShowDISCResult() {
            const scores = { D: 0, I: 0, S: 0, C: 0 };
            shareAnswers.forEach(a => {
                if (a.most) scores[a.most] = (scores[a.most] || 0) + 1;
                if (a.least) scores[a.least] = (scores[a.least] || 0) - 1;
            });
            const rawScores = {};
            Object.keys(scores).forEach(k => rawScores[k] = scores[k]);
            const min = Math.min(...Object.values(scores));
            const max = Math.max(...Object.values(scores));
            const range = max - min || 1;
            Object.keys(scores).forEach(k => { scores[k] = Math.round(((scores[k] - min) / range) * 100); });
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topType = sorted[0][0];
            const data = DISC_RESULTS[topType];
            showShare('shareResult');
            document.getElementById('shareResultContent').innerHTML = `
                <div style="margin-bottom:16px;">
                    <h3>Tipe DISC Anda: <strong style="color:${data.color}">${topType} - ${data.name}</strong></h3>
                    <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);">${data.desc}</p>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Grafik Kepribadian DISC</h3>
                    <div class="result-chart" style="gap:4px;">
                        ${['D','I','S','C'].map(k => '<div class="chart-bar"><div class="bar"><div class="bar-fill" style="height:' + scores[k] + '%;background:' + DISC_RESULTS[k].color + '"></div></div><div class="bar-label" style="color:' + DISC_RESULTS[k].color + '">' + k + '</div><div class="bar-value">' + (rawScores[k] > 0 ? '+' : '') + rawScores[k] + '</div></div>').join('')}
                    </div>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Kelebihan</h3>
                    <ul>${data.positive.map(p => '<li>' + p + '</li>').join('')}</ul>
                </div>
                <div style="text-align:center;padding:16px 0;">
                    <button class="btn btn-primary" onclick="shareGoHome()" style="width:100%;background:linear-gradient(135deg,#f093fb,#f5576c);">Kembali</button>
                </div>
            `;
        }

        function shareShowMBTIResult() {
            const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            MBTI_QUESTIONS.forEach((q, i) => {
                if (shareAnswers[i] !== null) { scores[q.options[shareAnswers[i]].letter]++; }
            });
            const tieType = ((scores.E >= scores.I) ? 'E' : 'I') + ((scores.S >= scores.N) ? 'S' : 'N') + ((scores.T >= scores.F) ? 'T' : 'F') + ((scores.J >= scores.P) ? 'J' : 'P');
            const finalType = MBTI_TYPES[tieType] ? tieType : 'INTJ';
            const data = MBTI_TYPES[finalType];
            showShare('shareResult');
            document.getElementById('shareResultContent').innerHTML = `
                <div style="text-align:center;padding:24px 0;">
                    <div style="font-size:3rem;font-weight:800;letter-spacing:6px;background:linear-gradient(135deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${finalType}</div>
                    <div style="color:rgba(255,255,255,0.6);">${data.name}</div>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Deskripsi</h3>
                    <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);">${data.desc}</p>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Kelebihan</h3>
                    <ul>${data.strengths.map(s => '<li>' + s + '</li>').join('')}</ul>
                </div>
                <div style="text-align:center;padding:16px 0;">
                    <button class="btn btn-primary" onclick="shareGoHome()" style="width:100%;background:linear-gradient(135deg,#4facfe,#00f2fe);">Kembali</button>
                </div>
            `;
        }

        function shareShowRAISECResult() {
            const scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
            RAISEC_QUESTIONS.forEach((q, i) => {
                if (shareAnswers[i] === true) scores[q.type]++;
            });
            const percentages = {};
            Object.keys(scores).forEach(k => { percentages[k] = Math.round((scores[k] / 5) * 100); });
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topType = sorted[0][0];
            const hollandCode = sorted.slice(0, 3).map(s => s[0]).join('');
            const data = RAISEC_RESULTS[topType];
            const typeColors = { R: '#e74c3c', I: '#3498db', A: '#e67e22', S: '#2ecc71', E: '#9b59b6', C: '#1abc9c' };
            const typeNames = { R: 'Realistic', I: 'Investigative', A: 'Artistic', S: 'Social', E: 'Enterprising', C: 'Conventional' };
            showShare('shareResult');
            document.getElementById('shareResultContent').innerHTML = `
                <div style="text-align:center;padding:20px 0;">
                    <h3>Kode Holland Anda</h3>
                    <div style="font-size:2.2rem;font-weight:800;letter-spacing:6px;margin:10px 0;background:linear-gradient(90deg,${typeColors[sorted[0][0]]},${typeColors[sorted[1][0]]},${typeColors[sorted[2][0]]});-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${hollandCode}</div>
                    <p style="font-size:0.85rem;color:rgba(255,255,255,0.5);">${sorted.map(s => '<span style="color:' + typeColors[s[0]] + ';font-weight:600;">' + s[0] + ' (' + typeNames[s[0]] + ')</span>').join(' - ')}</p>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Tipe Terkuat: <strong style="color:${data.color}">${topType} - ${data.name}</strong></h3>
                    <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);">${data.desc}</p>
                </div>
                <div style="margin-bottom:16px;">
                    <h3>Grafik Minat RAISEC</h3>
                    <div class="result-chart" style="gap:4px;">
                        ${['R','I','A','S','E','C'].map(k => '<div class="chart-bar"><div class="bar"><div class="bar-fill" style="height:' + percentages[k] + '%;background:' + typeColors[k] + '"></div></div><div class="bar-label" style="color:' + typeColors[k] + '">' + k + '</div><div class="bar-value">' + scores[k] + '/5</div></div>').join('')}
                    </div>
                </div>
                <div style="text-align:center;padding:16px 0;">
                    <button class="btn btn-primary" onclick="shareGoHome()" style="width:100%;background:linear-gradient(135deg,#e67e22,#d35400);">Kembali</button>
                </div>
            `;
        }

        // Back button handler for shared test
        window.addEventListener('popstate', () => {
            if (document.getElementById('shareTest').style.display === 'flex' || document.getElementById('shareResult').style.display === 'flex') {
                shareGoHome();
            }
        });
    </script>
</body>
</html>
